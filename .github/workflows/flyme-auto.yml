name: Flyme Auto ARM64 test release

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Build the minified UI preview APK (dev.amatv.flyme.preview) as a workflow artifact, no release
        type: boolean
        default: false
      stable:
        description: Publish as a stable release (latest, not a prerelease)
        type: boolean
        default: false
      test_build:
        description: Experimental test build of the branch it runs on (vehicle package, prerelease, notes from .github/test-build-notes.md)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ inputs.preview && format('flyme-auto-preview-{0}', github.ref_name) || 'flyme-auto-release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Releases always come from flyme-auto; previews and test builds use the branch they run on.
          ref: ${{ (inputs.preview || inputs.test_build) && github.ref || 'flyme-auto' }}
          persist-credentials: false

      # The SDK is not redistributable: it lives as a release asset of a private repo,
      # read with a fine-grained token limited to that repo.
      - name: Retrieve MusicKit SDK
        env:
          # The token was first stored under the old secret name; accept either.
          GH_TOKEN: ${{ secrets.MUSICKIT_SDK_TOKEN || secrets.MUSICKIT_SDK_DOWNLOAD_URL }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then echo 'Missing private build input: MUSICKIT_SDK_TOKEN'; exit 1; fi
          mkdir -p work/ci
          gh release download sdk-1.1.2 -R SakiTomato822/am_atv-sdk -p 'AndroidMusicKitSDK1.1.2.zip' -O work/ci/MusicKit.zip \
            || { echo 'SDK download failed. Check that MUSICKIT_SDK_TOKEN can read SakiTomato822/am_atv-sdk.'; exit 1; }

      - name: Retrieve private build inputs
        env:
          DEVELOPER_TOKEN: ${{ secrets.AM_DEVELOPER_TOKEN }}
          SIGNING_KEYSTORE: ${{ secrets.FLYME_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, time, zipfile
          for name in ('DEVELOPER_TOKEN', 'SIGNING_KEYSTORE'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing private build input: {name}')
          work = pathlib.Path('work/ci')
          sdk = work / 'MusicKit.zip'
          assert hashlib.sha256(sdk.read_bytes()).hexdigest() == '02b36be75a63e0c630fcb297b3367d8350a07bf37fc5e613ec26d24344e7f72b', 'Unexpected SDK archive'
          libs = pathlib.Path('app/libs')
          libs.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(sdk) as z:
              for name, sha in (
                  ('mediaplayback-release-1.1.1.aar', '39bc28cbc2413c0ce0477c1ef4d3b9e51bb163a7723d930c46bc089715116e3c'),
                  ('musickitauth-release-1.1.2.aar', 'c8f6f7ffec1baa5fb7fcdf04d3fcacfeb52c1de0c84c34b92a44dc6e431c4ef5'),
              ):
                  data = z.read('Android-MusicKit-SDK-1.1.2/' + name)
                  assert hashlib.sha256(data).hexdigest() == sha, 'Unexpected SDK library'
                  (libs / name).write_bytes(data)
          token = os.environ['DEVELOPER_TOKEN'].strip()
          parts = token.split('.')
          assert len(parts) == 3, 'Invalid developer token format'
          decode = lambda p: json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
          assert decode(parts[0]).get('alg') == 'ES256', 'Unexpected developer token algorithm'
          expiry = decode(parts[1]).get('exp', 0)
          assert expiry > time.time() + 86400, 'Developer token expires too soon'
          (work / 'developer-token.jwt').write_text(token)
          signing = work / 'flyme-signing.keystore'
          signing.parent.mkdir(exist_ok=True)
          signing.write_bytes(base64.b64decode(os.environ['SIGNING_KEYSTORE'], validate=True))
          print('SDK checksums and developer token expiry checks passed.')
          PY

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # On-device speech recognition engine (sherpa-onnx, Apache-2.0), pinned by hash. Models are
      # downloaded by the app when the user picks one; none ships in the APK.
      # Cached between runs: GitHub's release downloads time out (504) now and then. The hash
      # check below runs on a cached copy too.
      - name: Cache speech engine
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-2.0.1.aar
          key: sherpa-onnx-2.0.1-aar-a8d09d1d

      - name: Retrieve speech engine
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s app/libs/sherpa-onnx-2.0.1.aar ]; then
            curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors \
              -o app/libs/sherpa-onnx-2.0.1.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          fi
          echo 'a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar' | sha256sum -c -

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build and run unit tests
        env:
          PREVIEW_FLAGS: ${{ inputs.preview && '-Pflyme.uiVerification=true -Pflyme.previewRelease=true -Pflyme.previewAbi=arm64-v8a' || '' }}
        run: |
          chmod +x gradlew
          ./gradlew '-PAM_DEVELOPER_TOKEN_FILE=../work/ci/developer-token.jwt' '-PFLYME_SIGNING_KEYSTORE_FILE=work/ci/flyme-signing.keystore' '-Pamatv.testBuildType=flymeGecko' $PREVIEW_FLAGS :app:assembleFlymeGecko :app:testFlymeGeckoUnitTest --console=plain --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8'

      # Same fixed signing key as releases, so it installs over a local preview and keeps its sign-in.
      - name: Verify and upload preview APK
        if: inputs.preview
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/flymeGecko/app-flymeGecko.apk dist/AMATV-FlymeAuto-Preview-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/AMATV-FlymeAuto-Preview-arm64.apk | tee work/ci/signer.txt
          grep -qi 'certificate SHA-256 digest: 91f7b9d6496414a0fab0a87c8fcc60f929df0dd9fa4d4a9a52215869178bab8d' work/ci/signer.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/AMATV-FlymeAuto-Preview-arm64.apk | grep "package: name='dev.amatv.flyme.preview'"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.preview
        with:
          name: flyme-preview-apk
          path: dist/AMATV-FlymeAuto-Preview-arm64.apk
          retention-days: 3

      - name: Verify APK and prepare release
        if: ${{ !inputs.preview }}
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/flymeGecko/app-flymeGecko.apk dist/AMATV-FlymeAuto-Gecko-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/AMATV-FlymeAuto-Gecko-arm64.apk | tee work/ci/signer.txt
          python3 - <<'PY'
          import pathlib, re
          expected = '91f7b9d6496414a0fab0a87c8fcc60f929df0dd9fa4d4a9a52215869178bab8d'
          signers = re.findall(r'certificate SHA-256 digest: ([0-9a-fA-F]{64})', pathlib.Path('work/ci/signer.txt').read_text())
          assert [value.lower() for value in signers] == [expected], 'Signing certificate changed: refusing an incompatible update'
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/AMATV-FlymeAuto-Gecko-arm64.apk > work/ci/badging.txt
          grep "package: name='dev.amatv.flyme'" work/ci/badging.txt
          grep "native-code: 'arm64-v8a'" work/ci/badging.txt
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('dist/AMATV-FlymeAuto-Gecko-arm64.apk') as z:
              names = set(z.namelist())
              assert 'lib/arm64-v8a/libappleMusicSDK.so' in names
              assert 'lib/arm64-v8a/libxul.so' in names
              assert not any(n.startswith('lib/') and not n.startswith('lib/arm64-v8a/') for n in names)
          config = pathlib.Path('app/build/generated/source/buildConfig/flymeGecko/dev/amatv/BuildConfig.java').read_text()
          assert 'FLYME_UI_PREVIEW = false' in config
          assert 'AUTH_BROWSER_IS_GECKO = true' in config
          PY
          (cd dist && sha256sum AMATV-FlymeAuto-Gecko-arm64.apk > SHA256SUMS.txt)
          cat > dist/release-notes.md <<'EOF'
          Flyme Auto 非官方适配版（ARM64，Android 9+）首个正式版，基于 Sam 的 AM for TV。

          本版为 Flyme.12（versionCode 29），包含此前全部测试版的内容。与测试版使用同一固定签名，可直接覆盖安装并保留登录与应用数据。

          Flyme.12 的新变化：
          - 歌曲间淡入淡出更自然：不再把音量压到静音，只在最后 2 秒内轻轻降低（最多约 9 dB），下一首在 0.8 秒内回到原音量；曲线按分贝计算，听起来不像在调音量。
          - 歌手页的热门歌曲改为每列 4 首、左右滑动的横排，右侧延伸到屏幕边缘，松手后停在整列开头；下方的卡片排也延伸到边缘。
          - 浅色模式修复：状态栏与导航栏不再发黑，改为跟随页面的浅色底与深色图标；「刷新 Apple Music 内容」等深色按钮上的文字恢复可见；白天歌词不再过淡。

          主要功能（Flyme.6 至 Flyme.12 累计）：
          - 车机横屏布局与触控：首页、搜索、资料库、专辑页、歌手页（Apple Music 网页版布局）、播放页与胶囊播放器。
          - 原生 MusicKit 播放，不需要 Widevine；无缝播放，手动下一首也直接使用已排好的歌。
          - 没有 Widevine 的车机也能完整收听个人电台与歌曲电台（逐首播放）；电台历史可在播放队列中查看。
          - 歌曲间淡入淡出，专辑、电台、播放列表可分别开关。
          - 浅色 / 深色 / 跟随系统 / 按时间（时间可自选）外观，切换时有毛玻璃翻页动画。
          - 系统媒体控制：通知栏、锁屏与车机桌面媒体卡片，带封面与上一首 / 播放暂停 / 下一首。
          - 歌词跟唱、点击跳转、手指拖动查看；中文歌词不再重复显示简繁「翻译」。
          - 播放页加入喜好歌曲、跑马灯标题、可点击的歌手与专辑。
          - 启动先显示上次的首页，断网时也能浏览；设置页提供播放诊断与完整日志导出（凭证已遮蔽）。

          本版沿用上游 APK 的内置开发者 Token，有效期字段为 2027-04-22，到期前会随新版本更新；不包含签名私钥或任何用户登录凭证。

          包名 dev.amatv.flyme，与 UI Preview 包可并存。请下载 AMATV-FlymeAuto-Gecko-arm64.apk。
          EOF

      - name: Publish release APK
        if: ${{ !inputs.preview }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="flyme-auto-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "${{ inputs.test_build }}" = "true" ]; then
            notes=.github/test-build-notes.md
            [ -f "$notes" ] || notes=dist/release-notes.md
            gh release create "flyme-experiment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" dist/AMATV-FlymeAuto-Gecko-arm64.apk dist/SHA256SUMS.txt               --target "$(git rev-parse HEAD)" --prerelease --latest=false               --title "实验测试包 · ${GITHUB_REF_NAME} · $(git rev-parse --short HEAD)" --notes-file "$notes"
            exit 0
          fi
          # Name the release by the app's own version (e.g. Flyme.6), not the workflow run count.
          version=$(sed -n 's/.*versionNameSuffix = "-flyme\.\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version"
          if [ "${{ inputs.stable }}" = "true" ] && gh release view "flyme-auto-v${version}" > /dev/null 2>&1; then
            # A rebuilt stable version replaces its APK, checksums and notes in place.
            gh release upload "flyme-auto-v${version}" dist/AMATV-FlymeAuto-Gecko-arm64.apk dist/SHA256SUMS.txt --clobber
            gh release edit "flyme-auto-v${version}" --notes-file dist/release-notes.md
          elif [ "${{ inputs.stable }}" = "true" ]; then
            gh release create "flyme-auto-v${version}" dist/AMATV-FlymeAuto-Gecko-arm64.apk dist/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --latest --title "Flyme Auto · Flyme.${version}" --notes-file dist/release-notes.md
          else
            gh release create "$tag" dist/AMATV-FlymeAuto-Gecko-arm64.apk dist/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --prerelease --latest=false --title "Flyme Auto 测试版 · Flyme.${version}" --notes-file dist/release-notes.md
          fi

      - name: Remove private build inputs
        if: always()
        run: |
          rm -f work/ci/developer-token.jwt work/ci/MusicKit.zip work/ci/flyme-signing.keystore
          rm -f app/libs/mediaplayback-release-1.1.1.aar app/libs/musickitauth-release-1.1.2.aar
