name: Flyme Auto ARM64 test release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flyme-auto-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: flyme-auto
          persist-credentials: false

      # The SDK is not redistributable: it lives as a release asset of a private repo,
      # read with a fine-grained token limited to that repo.
      - name: Retrieve MusicKit SDK
        env:
          # The token was first stored under the old secret name; accept either.
          GH_TOKEN: ${{ secrets.MUSICKIT_SDK_TOKEN || secrets.MUSICKIT_SDK_DOWNLOAD_URL }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then echo 'Missing private build input: MUSICKIT_SDK_TOKEN'; exit 1; fi
          mkdir -p work/ci
          gh release download sdk-1.1.2 -R SakiTomato822/am_atv-sdk -p 'AndroidMusicKitSDK1.1.2.zip' -O work/ci/MusicKit.zip \
            || { echo 'SDK download failed. Check that MUSICKIT_SDK_TOKEN can read SakiTomato822/am_atv-sdk.'; exit 1; }

      - name: Retrieve private build inputs
        env:
          DEVELOPER_TOKEN: ${{ secrets.AM_DEVELOPER_TOKEN }}
          SIGNING_KEYSTORE: ${{ secrets.FLYME_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, time, zipfile
          for name in ('DEVELOPER_TOKEN', 'SIGNING_KEYSTORE'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing private build input: {name}')
          work = pathlib.Path('work/ci')
          sdk = work / 'MusicKit.zip'
          assert hashlib.sha256(sdk.read_bytes()).hexdigest() == '02b36be75a63e0c630fcb297b3367d8350a07bf37fc5e613ec26d24344e7f72b', 'Unexpected SDK archive'
          libs = pathlib.Path('app/libs')
          libs.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(sdk) as z:
              for name, sha in (
                  ('mediaplayback-release-1.1.1.aar', '39bc28cbc2413c0ce0477c1ef4d3b9e51bb163a7723d930c46bc089715116e3c'),
                  ('musickitauth-release-1.1.2.aar', 'c8f6f7ffec1baa5fb7fcdf04d3fcacfeb52c1de0c84c34b92a44dc6e431c4ef5'),
              ):
                  data = z.read('Android-MusicKit-SDK-1.1.2/' + name)
                  assert hashlib.sha256(data).hexdigest() == sha, 'Unexpected SDK library'
                  (libs / name).write_bytes(data)
          token = os.environ['DEVELOPER_TOKEN'].strip()
          parts = token.split('.')
          assert len(parts) == 3, 'Invalid developer token format'
          decode = lambda p: json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
          assert decode(parts[0]).get('alg') == 'ES256', 'Unexpected developer token algorithm'
          expiry = decode(parts[1]).get('exp', 0)
          assert expiry > time.time() + 86400, 'Developer token expires too soon'
          (work / 'developer-token.jwt').write_text(token)
          signing = work / 'flyme-signing.keystore'
          signing.parent.mkdir(exist_ok=True)
          signing.write_bytes(base64.b64decode(os.environ['SIGNING_KEYSTORE'], validate=True))
          print('SDK checksums and developer token expiry checks passed.')
          PY

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew '-PAM_DEVELOPER_TOKEN_FILE=../work/ci/developer-token.jwt' '-PFLYME_SIGNING_KEYSTORE_FILE=work/ci/flyme-signing.keystore' '-Pamatv.testBuildType=flymeGecko' :app:assembleFlymeGecko :app:testFlymeGeckoUnitTest --console=plain --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8'

      - name: Verify APK and prepare release
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/flymeGecko/app-flymeGecko.apk dist/AMATV-FlymeAuto-Gecko-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/AMATV-FlymeAuto-Gecko-arm64.apk | tee work/ci/signer.txt
          python3 - <<'PY'
          import pathlib, re
          expected = '91f7b9d6496414a0fab0a87c8fcc60f929df0dd9fa4d4a9a52215869178bab8d'
          signers = re.findall(r'certificate SHA-256 digest: ([0-9a-fA-F]{64})', pathlib.Path('work/ci/signer.txt').read_text())
          assert [value.lower() for value in signers] == [expected], 'Signing certificate changed: refusing an incompatible update'
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/AMATV-FlymeAuto-Gecko-arm64.apk > work/ci/badging.txt
          grep "package: name='dev.amatv.flyme'" work/ci/badging.txt
          grep "native-code: 'arm64-v8a'" work/ci/badging.txt
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('dist/AMATV-FlymeAuto-Gecko-arm64.apk') as z:
              names = set(z.namelist())
              assert 'lib/arm64-v8a/libappleMusicSDK.so' in names
              assert 'lib/arm64-v8a/libxul.so' in names
              assert not any(n.startswith('lib/') and not n.startswith('lib/arm64-v8a/') for n in names)
          config = pathlib.Path('app/build/generated/source/buildConfig/flymeGecko/dev/amatv/BuildConfig.java').read_text()
          assert 'FLYME_UI_PREVIEW = false' in config
          assert 'AUTH_BROWSER_IS_GECKO = true' in config
          PY
          (cd dist && sha256sum AMATV-FlymeAuto-Gecko-arm64.apk > SHA256SUMS.txt)
          cat > dist/release-notes.md <<'EOF'
          Flyme Auto 非官方适配测试版（ARM64，Android 9+）。

          本版为 Flyme.6（versionCode 20），同时包含未能发布的 Flyme.5 的全部内容。与 Flyme.3 / Flyme.4 使用同一固定签名，可覆盖安装并保留应用数据。

          - 电台改用内置 GeckoView 中的 MusicKit JS 播放（个人电台、歌曲电台、Apple Music 1 等直播），沿用 App 现有的 Apple Music 登录，无需再次网页登录；普通歌曲仍由原生 MusicKit 播放。
          - 新播放页（Apple TV / Cider 风格）：左侧封面、歌名与无底色控制按钮，细进度条，右侧歌词；暂停时封面缩小。歌词开关会被记住。
          - 电台播放时封面上方显示电台名称；直播电台使用独立页面：红色「直播」标签、大字台名、单一播放/暂停键与底部直播条。普通歌曲载入时不再误显示为直播。
          - 播放队列靠左排列：正在播放在前，其后为「接下来」，向左滑可看已播放歌曲。首次播放时请求录音权限以显示真实频谱；拒绝、电台或车机不支持时显示装饰性律动。
          - 资料库改为一页：分类按钮、网格与列表切换、竖向排列并自动续载。专辑与歌曲默认按加入时间（最新在前）排序，每种排序再点一次可切换正序／倒序；非默认排序会在后台载入全部项目。
          - 资料库艺人页：上方为资料库中的专辑，下方为 Apple Music 的热门歌曲、专辑与单曲／EP。资料库专辑页可「显示完整专辑」。
          - 顶部导航居中，左侧账号，右侧常驻迷你播放器（显示歌曲或电台，可直接暂停）。首页背景取自正在播放封面的流动色彩。

          本版沿用上游 APK 的内置开发者 Token，有效期字段为 2027-04-22；不包含签名私钥或任何用户登录凭证。是否被服务端撤销、真实登录和播放效果需实机验证。后续 Token 更新方式仍待与上游协商。

          包名 dev.amatv.flyme，与 UI Preview 包可并存。请下载 AMATV-FlymeAuto-Gecko-arm64.apk。
          EOF

      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="flyme-auto-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/AMATV-FlymeAuto-Gecko-arm64.apk dist/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --prerelease --latest=false --title "Flyme Auto 测试版 · ${GITHUB_RUN_NUMBER}" --notes-file dist/release-notes.md

      - name: Remove private build inputs
        if: always()
        run: |
          rm -f work/ci/developer-token.jwt work/ci/MusicKit.zip work/ci/flyme-signing.keystore
          rm -f app/libs/mediaplayback-release-1.1.1.aar app/libs/musickitauth-release-1.1.2.aar
